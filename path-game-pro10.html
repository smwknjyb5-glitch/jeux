<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة المسار: اختر المسار واحفظ الصورة</title>
<style>
:root{--bg:#fdf3f6;--ink:#4a2c3d;--trail:#e8527a;--guide:#c9a6b6;--btn:#4a2c3d;--btnt:#fff;--card:#fff;--soft:#f3dfe7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1a24;--ink:#fbe9f0;--trail:#ff7a9f;--guide:#7d5a6c;--btn:#fbe9f0;--btnt:#2a1a24;--card:#3a2532;--soft:#4b3140}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Tahoma",sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:1.4rem;margin:8px 0 4px;text-align:center}
p{margin:0 0 12px;text-align:center;min-height:1.6em}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;align-items:center}
.pick label{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
#wrap{width:100%;max-width:720px;background:var(--card);border-radius:20px;padding:8px}
canvas{width:100%;height:auto;display:block;touch-action:none;cursor:grab}
button{font:inherit;background:var(--btn);color:var(--btnt);border:0;border-radius:12px;padding:9px 16px;cursor:pointer}
button.chip{background:var(--soft);color:var(--ink)}
button.chip[aria-pressed="true"]{background:var(--trail);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--trail);outline-offset:2px}
.bar{margin-top:14px}
.colors label{display:flex;align-items:center;gap:6px;font-size:.9rem}input[type=color]{width:38px;height:30px;border:0;padding:0;background:none;cursor:pointer}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<h1>اختر المسار ودع الشخصية تصل إلى هدفها</h1>
<p id="msg"></p>

<div class="row pick">
  <label>الصورة الأولى (المتحركة)<input type="file" id="fa" accept="image/*"></label>
  <label>الصورة الثانية (الهدف)<input type="file" id="fb" accept="image/*"></label>
</div>
<div class="row" id="paths" role="group" aria-label="المسارات"></div>

<div class="row colors">
  <label>لون الأثر <input type="color" id="ct" value="#e8527a"></label>
  <label>لون المسار <input type="color" id="cg" value="#c9a6b6"></label>
  <label>لون الخلفية <input type="color" id="cb" value="#ffffff"></label>
  <button class="chip" id="cr">الألوان الافتراضية</button>
</div>
<div id="wrap"><canvas id="c" width="720" height="440" aria-label="لوحة اللعبة"></canvas></div>

<div class="row bar">
  <button id="play">شغّل الحركة</button>
  <label>السرعة <input type="range" id="spd" min="1" max="8" value="3"></label>
  <button id="swap">بدّل الأدوار</button>
  <button id="reset">من جديد</button>
</div>
<div class="row">
  <button id="png">حفظ الصورة (PNG)</button>
  <button id="rec">تسجيل الحركة (فيديو)</button>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),msg=document.getElementById('msg');
const W=720,H=440,$=id=>document.getElementById(id);
const P=a=>a.map(([x,y])=>({x,y}));
const gen=(f,n=200)=>Array.from({length:n+1},(_,i)=>f(i/n));
function resample(pts,n=300){
  const d=[0];for(let i=1;i<pts.length;i++)d.push(d[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
  const L=d[d.length-1]||1,out=[];let j=1;
  for(let i=0;i<=n;i++){const s=L*i/n;while(j<pts.length-1&&d[j]<s)j++;
    const seg=d[j]-d[j-1]||1,t=Math.min(1,Math.max(0,(s-d[j-1])/seg));
    out.push({x:pts[j-1].x+(pts[j].x-pts[j-1].x)*t,y:pts[j-1].y+(pts[j].y-pts[j-1].y)*t});}
  return out;}
const PATHS={
  wave:{name:'موجة',pts:()=>gen(t=>({x:640-560*t,y:220+Math.sin(t*Math.PI*3)*110*(1-.25*t)}))},
  zigzag:{name:'متعرّج',pts:()=>P([[650,220],[560,60],[470,380],[380,60],[290,380],[200,60],[110,220]])},
  spiral:{name:'حلزون',pts:()=>gen(t=>{const a=t*Math.PI*3.6,r=200-175*t;return{x:360+r*Math.cos(a),y:220+r*Math.sin(a)*.95};},400)},
  arc:{name:'قوس',pts:()=>gen(t=>({x:650-580*t,y:390-330*Math.sin(t*Math.PI)}))},
  maze:{name:'متاهة',pts:()=>P([[650,390],[650,60],[530,60],[530,390],[410,390],[410,60],[290,60],[290,390],[170,390],[170,60],[70,60]])},
  heart:{name:'قلب',pts:()=>gen(t=>{const a=Math.PI-t*(2*Math.PI-.9),X=16*Math.sin(a)**3,Y=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);return{x:360+11*X,y:220-11*(Y+2.5)};},300)},
  star:{name:'نجمة',pts:()=>P([0,2,4,1,3].map(k=>{const q=-Math.PI/2+2*Math.PI*k/5;return[360+175*Math.cos(q),240+165*Math.sin(q)];}))},
  stairs:{name:'درج',pts:()=>P([[660,400],[560,400],[560,320],[460,320],[460,240],[360,240],[360,160],[260,160],[260,80],[100,80]])},
  mountain:{name:'جبل',pts:()=>P([[650,380],[500,380],[360,75],[220,380],[70,380]])},
  snake:{name:'ثعبان',pts:()=>gen(t=>({x:360+140*Math.sin(t*Math.PI*3),y:75+300*t}),300)},
  lanes:{name:'ممرات',pts:()=>P([[660,80],[80,80],[80,230],[640,230],[640,375],[80,375]])},
  circle:{name:'دائرة',pts:()=>gen(t=>{const q=t*Math.PI*1.8;return{x:360+160*Math.cos(q),y:235+150*Math.sin(q)};},300)}
};
let sel='wave',base=[],firstMover=true,path=[],cur=0,dragging=false,timer=null,won=false;
const col={trail:null,guide:null,bg:null};
let custom=null,custMode=false,custPts=[],mr=null,recTick=null;
const imgs={a:null,b:null};

function figure(p,kind,s=1){
  ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);
  const dress=kind==='girl'?'#e8527a':'#7a5cd6',hair=kind==='girl'?'#5b3425':'#e0a526';
  ctx.fillStyle=hair;ctx.beginPath();ctx.arc(0,-34,19,0,7);ctx.fill();
  if(kind==='girl'){ctx.fillRect(-22,-34,8,34);ctx.fillRect(14,-34,8,34);}
  else{ctx.beginPath();ctx.arc(-17,-44,7,0,7);ctx.arc(17,-44,7,0,7);ctx.fill();}
  ctx.fillStyle='#ffd9b8';ctx.beginPath();ctx.arc(0,-32,15,0,7);ctx.fill();
  ctx.fillStyle='#333';ctx.beginPath();ctx.arc(-5,-34,2,0,7);ctx.arc(5,-34,2,0,7);ctx.fill();
  ctx.strokeStyle='#c0392b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-29,5,.2,2.9);ctx.stroke();
  ctx.fillStyle=dress;ctx.beginPath();ctx.moveTo(-9,-17);ctx.lineTo(9,-17);ctx.lineTo(24,24);ctx.lineTo(-24,24);ctx.fill();
  ctx.fillStyle='#ffd9b8';ctx.fillRect(-10,24,6,12);ctx.fillRect(4,24,6,12);
  ctx.restore();}
function item(p,key,s){const im=imgs[key];
  if(!im){figure(p,key==='a'?'girl':'doll',s);return;}
  let h=100*s,w=h*im.width/im.height;if(w>130*s){w=130*s;h=w*im.height/im.width;}
  ctx.drawImage(im,p.x-w/2,p.y+36-h,w,h);}

function setup(){
  path=firstMover?base:[...base].reverse();cur=0;won=false;clearInterval(timer);
  msg.textContent='اسحب الشخصية على الخط المنقّط، أو اضغط «شغّل الحركة».';draw();}
function draw(){
  const g=getComputedStyle(document.documentElement);
  ctx.fillStyle=col.bg||g.getPropertyValue('--card');ctx.fillRect(0,0,W,H);
  ctx.lineCap='round';ctx.lineJoin='round';
  if(custMode){ctx.setLineDash([2,14]);ctx.lineWidth=7;ctx.strokeStyle=col.guide||g.getPropertyValue('--guide');
    ctx.beginPath();custPts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.setLineDash([]);return;}
  ctx.setLineDash([2,14]);ctx.lineWidth=7;ctx.strokeStyle=col.guide||g.getPropertyValue('--guide');
  ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
  ctx.setLineDash([]);ctx.lineWidth=9;ctx.strokeStyle=col.trail||g.getPropertyValue('--trail');
  ctx.beginPath();for(let i=0;i<=cur;i++){const p=path[i];i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);}ctx.stroke();
  const end=path[path.length-1],m=path[cur],mk=firstMover?'a':'b',tk=firstMover?'b':'a';
  item(end,tk,1);item(m,mk,1.05);
  if(won){ctx.font='44px serif';ctx.textAlign='center';['✨','🎉','💖','✨'].forEach((e,i)=>ctx.fillText(e,end.x-60+i*40,end.y-80-(i%2)*18));}
}
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function move(q){let best=cur,bd=1e9;
  for(let i=cur;i<Math.min(path.length,cur+30);i++){const d=Math.hypot(path[i].x-q.x,path[i].y-q.y);if(d<bd){bd=d;best=i;}}
  if(bd<55){cur=best;if(cur>=path.length-3)finish();}else msg.textContent='ابقَ قريباً من الخط المنقّط.';
  draw();}
function finish(){cur=path.length-1;won=true;dragging=false;clearInterval(timer);
  msg.textContent='أحسنت! وصلت الشخصية إلى هدفها 🎉';draw();
  if(mr){setTimeout(()=>{if(mr&&mr.state!=='inactive')mr.stop();},1200);}}

cv.addEventListener('pointerdown',e=>{const q=pos(e);
  if(custMode){custPts=[q];dragging=true;cv.setPointerCapture(e.pointerId);draw();return;}
  if(won)return;const m=path[cur];
  if(Math.hypot(m.x-q.x,m.y-q.y)<70){dragging=true;cv.setPointerCapture(e.pointerId);msg.textContent='';}});
cv.addEventListener('pointermove',e=>{if(!dragging)return;const q=pos(e);
  if(custMode){const l=custPts[custPts.length-1];if(Math.hypot(q.x-l.x,q.y-l.y)>4){custPts.push(q);draw();}}else move(q);});
function endDrag(){if(!dragging)return;dragging=false;
  if(custMode){if(custPts.length>8){custom=resample(custPts,300);custMode=false;choose('custom');}
    else{msg.textContent='المسار قصير جداً، حاول الرسم من جديد.';custPts=[];draw();}}}
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);

function choose(k){sel=k;custMode=false;
  base=k==='custom'?custom:resample(PATHS[k].pts(),300);
  document.querySelectorAll('#paths .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));setup();}
const box=$('paths');
Object.entries(PATHS).forEach(([k,v])=>{const b=document.createElement('button');b.className='chip';b.textContent=v.name;b.dataset.k=k;b.setAttribute('aria-pressed','false');b.onclick=()=>choose(k);box.appendChild(b);});
const cb=document.createElement('button');cb.className='chip';cb.textContent='ارسم مسارك';cb.dataset.k='custom';cb.setAttribute('aria-pressed','false');
cb.onclick=()=>{custMode=true;custPts=[];clearInterval(timer);msg.textContent='ارسم بإصبعك أو بالفأرة مساراً من البداية إلى النهاية.';
  document.querySelectorAll('#paths .chip').forEach(b=>b.setAttribute('aria-pressed',b===cb));draw();};
box.appendChild(cb);

function play(){if(custMode)return;setup();msg.textContent='';
  timer=setInterval(()=>{cur+=+$('spd').value;if(cur>=path.length-1)finish();else draw();},22);}
$('play').onclick=play;
$('swap').onclick=()=>{firstMover=!firstMover;setup();};
$('reset').onclick=()=>{if(!custMode)setup();};
$('spd').oninput=()=>{if(timer&&!won){clearInterval(timer);timer=setInterval(()=>{cur+=+$('spd').value;if(cur>=path.length-1)finish();else draw();},22);}};

function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
$('png').onclick=()=>{draw();cv.toBlob(b=>{if(b)dl(b,'path-game.png');msg.textContent='تم حفظ الصورة بالحالة الحالية للمسار.';});};
$('rec').onclick=()=>{
  if(!window.MediaRecorder||!cv.captureStream){msg.textContent='هذا المتصفح لا يدعم تسجيل الفيديو.';return;}
  if(custMode)return;
  const chunks=[];mr=new MediaRecorder(cv.captureStream(30));
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  mr.onstop=()=>{clearInterval(recTick);const ext=mr.mimeType.includes('mp4')?'mp4':'webm';
    dl(new Blob(chunks,{type:mr.mimeType||'video/webm'}),'path-game.'+ext);mr=null;msg.textContent='تم حفظ الفيديو.';};
  mr.start();recTick=setInterval(draw,40);play();msg.textContent='جارٍ التسجيل...';};

['a','b'].forEach(k=>$('f'+k).onchange=e=>{const f=e.target.files[0];if(!f)return;
  const im=new Image();im.onload=()=>{imgs[k]=im;draw();};im.src=URL.createObjectURL(f);});
const defs={ct:['trail','#e8527a'],cg:['guide','#c9a6b6'],cb:['bg','#ffffff']};
Object.entries(defs).forEach(([id,[k]])=>$(id).oninput=e=>{col[k]=e.target.value;draw();});
$('cr').onclick=()=>{Object.entries(defs).forEach(([id,[k,v]])=>{col[k]=null;$(id).value=v;});draw();};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
choose('wave');
</script>
</body>
</html>
