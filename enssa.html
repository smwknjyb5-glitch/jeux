 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎮 لعبة نسيت ماذا - الذاكرة</title>
    <style>
        /* ---------------------- التصميم العام ---------------------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
            background: linear-gradient(145deg, #1e2b3a 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 30px 25px 40px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), inset 0 2px 4px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s ease;
        }

        /* ---------------------- الرأس والإحصائيات ---------------------- */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            gap: 12px;
            color: #f0f4fa;
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #facc15, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(250, 204, 21, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title span {
            font-size: 1.8rem;
            -webkit-text-fill-color: initial;
        }

        .stats {
            display: flex;
            gap: 24px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .stat-item i {
            font-size: 1.3rem;
        }

        .stat-value {
            background: #1e293b;
            padding: 2px 14px;
            border-radius: 40px;
            font-weight: 700;
            color: #facc15;
            min-width: 40px;
            text-align: center;
            font-size: 1.2rem;
        }

        /* ---------------------- شبكة البطاقات ---------------------- */
        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin: 18px 0 28px;
        }

        /* البطاقة */
        .card {
            aspect-ratio: 1 / 1;
            background: radial-gradient(circle at 20% 30%, #3b4b5e, #1e2a36);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.8rem;
            font-weight: 400;
            cursor: pointer;
            box-shadow: 0 10px 0 #0f151f, 0 8px 20px rgba(0, 0, 0, 0.6);
            transition: all 0.15s ease-in-out;
            border: 1px solid rgba(255, 255, 255, 0.06);
            user-select: none;
            position: relative;
            transform: scale(1);
        }

        .card:hover:not(.matched):not(.flipped) {
            transform: scale(1.02);
            background: radial-gradient(circle at 20% 30%, #4d6077, #263340);
            box-shadow: 0 8px 0 #0f151f, 0 12px 28px rgba(0, 0, 0, 0.7);
        }

        /* البطاقة المقلوبة (تظهر الرمز) */
        .card.flipped {
            background: radial-gradient(circle at 20% 30%, #f1f5f9, #cbd5e1);
            box-shadow: 0 8px 0 #7f8a9b, 0 8px 24px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(0.98);
        }

        .card.flipped .card-content {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .card .card-content {
            opacity: 0;
            transform: scale(0.4) rotate(20deg);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 3.8rem;
            line-height: 1;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
        }

        /* البطاقات المتطابقة */
        .card.matched {
            background: radial-gradient(circle at 20% 30%, #22c55e, #15803d);
            box-shadow: 0 6px 0 #0a4d1e, 0 8px 24px rgba(34, 197, 94, 0.3);
            border-color: rgba(34, 197, 94, 0.4);
            cursor: default;
            transform: scale(0.96);
            pointer-events: none;
        }

        .card.matched .card-content {
            opacity: 1;
            transform: scale(1) rotate(0deg);
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        /* حالة التعطيل المؤقت أثناء المقارنة */
        .card.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        /* ---------------------- الأزرار ---------------------- */
        .actions {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .btn {
            padding: 14px 36px;
            border: none;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(145deg, #facc15, #eab308);
            color: #0f172a;
            cursor: pointer;
            box-shadow: 0 8px 0 #a16207, 0 6px 18px rgba(250, 204, 21, 0.3);
            transition: all 0.08s linear;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #a16207, 0 10px 28px rgba(250, 204, 21, 0.4);
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #a16207;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #f0f4fa;
            box-shadow: 0 8px 0 #1e293b, 0 6px 18px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.14);
            box-shadow: 0 10px 0 #1e293b, 0 10px 28px rgba(0, 0, 0, 0.5);
        }

        .btn-secondary:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #1e293b;
        }

        /* ---------------------- رسالة الفوز ---------------------- */
        .win-message {
            text-align: center;
            margin-top: 22px;
            font-size: 1.6rem;
            font-weight: 700;
            color: #facc15;
            background: rgba(0, 0, 0, 0.35);
            padding: 16px 10px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(250, 204, 21, 0.2);
            display: none;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .win-message.show {
            display: block;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.6);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ---------------------- استجابة للشاشات الصغيرة ---------------------- */
        @media (max-width: 600px) {
            .game-container {
                padding: 20px 14px 30px;
                border-radius: 32px;
            }

            .title {
                font-size: 1.6rem;
            }

            .stats {
                gap: 12px;
                padding: 8px 16px;
            }

            .stat-item {
                font-size: 0.95rem;
            }

            .board {
                gap: 10px;
            }

            .card {
                border-radius: 16px;
                font-size: 2.8rem;
            }

            .card .card-content {
                font-size: 2.8rem;
            }

            .btn {
                padding: 12px 24px;
                font-size: 1rem;
            }

            .win-message {
                font-size: 1.3rem;
                padding: 12px 10px;
            }
        }

        @media (max-width: 420px) {
            .board {
                gap: 8px;
            }
            .card {
                border-radius: 12px;
                font-size: 2.2rem;
            }
            .card .card-content {
                font-size: 2.2rem;
            }
            .stats {
                gap: 8px;
                padding: 6px 12px;
            }
            .stat-item {
                font-size: 0.8rem;
            }
            .stat-value {
                min-width: 30px;
                font-size: 1rem;
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- الرأس -->
        <div class="header">
            <div class="title">
                <span>🧠</span> انقر على مربع تظهر لك صورة ابحث عن مثيلتها لتثبيت المتماثلين
            </div>
            <div class="stats">
                <div class="stat-item">
                    <span>🔄</span> المحاولات
                    <span class="stat-value" id="attempts">0</span>
                </div>
                <div class="stat-item">
                    <span>⏱️</span> الزمن
                    <span class="stat-value" id="timer">0s</span>
                </div>
            </div>
        </div>

        <!-- شبكة البطاقات -->
        <div class="board" id="board"></div>

        <!-- رسالة الفوز -->
        <div class="win-message" id="winMessage">
            🎉 تهانينا! لقد أنهيت اللعبة في <span id="finalTime">0</span> ثانية وبـ <span id="finalAttempts">0</span> محاولة 🎉
        </div>

        <!-- الأزرار -->
        <div class="actions">
            <button class="btn" id="resetBtn">🔄 لعبة جديدة</button>
            <button class="btn btn-secondary" id="shuffleBtn">🎲 خلط البطاقات</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- البيانات الأساسية ----------
            // 8 أزواج من الرموز (إيموجي)
            const EMOJIS = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
            // نضاعف المصفوفة لنحصل على 16 بطاقة (زوجان من كل رمز)
            let cardValues = [...EMOJIS, ...EMOJIS];
            let cards = []; // عناصر البطاقات (DOM)
            let cardData = []; // بيانات كل بطاقة { value, matched, flipped, element }

            let firstCard = null; // البطاقة المقلوبة الأولى
            let secondCard = null; // البطاقة المقلوبة الثانية
            let lockBoard = false; // قفل اللوحة أثناء المقارنة أو الحركة
            let attempts = 0;
            let matchedPairs = 0;
            let timerInterval = null;
            let seconds = 0;
            let isGameFinished = false; // لمنع أي تفاعل بعد الفوز

            // عناصر DOM
            const boardEl = document.getElementById('board');
            const attemptsEl = document.getElementById('attempts');
            const timerEl = document.getElementById('timer');
            const winMessageEl = document.getElementById('winMessage');
            const finalTimeEl = document.getElementById('finalTime');
            const finalAttemptsEl = document.getElementById('finalAttempts');
            const resetBtn = document.getElementById('resetBtn');
            const shuffleBtn = document.getElementById('shuffleBtn');

            // ---------- الدوال المساعدة ----------
            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            // بدء المؤقت (فقط إذا لم يكن قيد التشغيل)
            function startTimer() {
                if (timerInterval) return;
                timerInterval = setInterval(() => {
                    seconds++;
                    timerEl.textContent = seconds + 's';
                }, 1000);
            }

            // إيقاف المؤقت
            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }

            // إعادة ضبط المؤقت
            function resetTimer() {
                stopTimer();
                seconds = 0;
                timerEl.textContent = '0s';
            }

            // تحديث عداد المحاولات
            function updateAttempts() {
                attemptsEl.textContent = attempts;
            }

            // التحقق من الفوز
            function checkWin() {
                if (matchedPairs === EMOJIS.length) {
                    isGameFinished = true;
                    stopTimer();
                    // عرض رسالة الفوز
                    finalTimeEl.textContent = seconds;
                    finalAttemptsEl.textContent = attempts;
                    winMessageEl.classList.add('show');
                    // إلغاء أي تحديدات معلقة
                    firstCard = null;
                    secondCard = null;
                    lockBoard = false;
                }
            }

            // ---------- وظائف البطاقات ----------
            // قلب البطاقة (إظهار الرمز)
            function flipCard(cardElement) {
                if (lockBoard) return;
                if (isGameFinished) return;
                if (cardElement.classList.contains('flipped') || cardElement.classList.contains('matched')) return;

                // بدء المؤقت عند أول قلب
                if (attempts === 0 && matchedPairs === 0 && !timerInterval) {
                    startTimer();
                }

                // قلب البطاقة
                cardElement.classList.add('flipped');
                const index = parseInt(cardElement.dataset.index);
                const data = cardData[index];

                // تعيين البطاقة الأولى أو الثانية
                if (!firstCard) {
                    firstCard = cardElement;
                    // لا نقوم بأي شيء آخر
                } else if (!secondCard && firstCard !== cardElement) {
                    secondCard = cardElement;
                    // لدينا بطاقتان مقلوبتان ⇒ نتحقق من التطابق
                    checkMatch();
                } else {
                    // في حالة الضغط على نفس البطاقة أو حالة غير متوقعة
                    return;
                }
            }

            // التحقق من التطابق بين البطاقتين المقلوبتين
            function checkMatch() {
                const idx1 = parseInt(firstCard.dataset.index);
                const idx2 = parseInt(secondCard.dataset.index);
                const data1 = cardData[idx1];
                const data2 = cardData[idx2];

                // زيادة المحاولات
                attempts++;
                updateAttempts();

                if (data1.value === data2.value && idx1 !== idx2) {
                    // تطابق ✅
                    data1.matched = true;
                    data2.matched = true;
                    firstCard.classList.add('matched');
                    secondCard.classList.add('matched');
                    matchedPairs++;

                    // تنظيف البطاقات المقلوبة
                    firstCard = null;
                    secondCard = null;

                    // التحقق من الفوز بعد التطابق
                    checkWin();
                } else {
                    // لا تطابق ❌ → قفل اللوحة وإعادة البطاقات بعد تأخير
                    lockBoard = true;
                    // تعطيل البطاقات مؤقتاً لمنع النقر أثناء الانتظار
                    firstCard.classList.add('disabled');
                    secondCard.classList.add('disabled');

                    setTimeout(() => {
                        // إعادة البطاقات (إلا إذا تم الفوز أثناء الانتظار)
                        if (!isGameFinished) {
                            // إذا لم يتم إلغاء القفل بواسطة الفوز
                            if (firstCard && !firstCard.classList.contains('matched')) {
                                firstCard.classList.remove('flipped');
                            }
                            if (secondCard && !secondCard.classList.contains('matched')) {
                                secondCard.classList.remove('flipped');
                            }
                        }

                        // إزالة حالة التعطيل
                        if (firstCard) firstCard.classList.remove('disabled');
                        if (secondCard) secondCard.classList.remove('disabled');

                        // إعادة ضبط المتغيرات وفتح القفل
                        firstCard = null;
                        secondCard = null;
                        lockBoard = false;

                        // التحقق من الفوز مجدداً (في حال حدث أثناء التأخير)
                        checkWin();
                    }, 700);
                }
            }

            // ---------- إنشاء اللوحة ----------
            function buildBoard(valuesArray) {
                // تنظيف اللوحة
                boardEl.innerHTML = '';
                cardData = [];
                cards = [];
                firstCard = null;
                secondCard = null;
                lockBoard = false;
                matchedPairs = 0;
                attempts = 0;
                isGameFinished = false;
                winMessageEl.classList.remove('show');
                resetTimer();
                updateAttempts();

                // خلط القيم إذا أردنا
                const shuffled = shuffleArray([...valuesArray]);

                // إنشاء البطاقات
                shuffled.forEach((value, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.dataset.index = index;

                    const content = document.createElement('span');
                    content.className = 'card-content';
                    content.textContent = value;
                    card.appendChild(content);

                    // إضافة حدث النقر
                    card.addEventListener('click', function(e) {
                        flipCard(this);
                    });

                    boardEl.appendChild(card);
                    cards.push(card);
                    cardData.push({
                        value: value,
                        matched: false,
                        flipped: false,
                        element: card
                    });
                });
            }

            // ---------- إعادة تعيين اللعبة (مع خلط) ----------
            function resetGame() {
                // إيقاف المؤقت وإعادة ضبطه
                stopTimer();
                seconds = 0;
                timerEl.textContent = '0s';

                // إعادة تعيين المتغيرات
                firstCard = null;
                secondCard = null;
                lockBoard = false;
                matchedPairs = 0;
                attempts = 0;
                isGameFinished = false;
                winMessageEl.classList.remove('show');
                updateAttempts();

                // خلط القيم وإعادة بناء اللوحة
                const freshValues = [...EMOJIS, ...EMOJIS];
                buildBoard(freshValues);
            }

            // ---------- خلط البطاقات الموجودة (مع الحفاظ على الحالة) ----------
            function shuffleBoard() {
                // لا يمكن الخلط أثناء اللعب أو بعد الفوز
                if (lockBoard || isGameFinished) return;
                // إذا كانت كل البطاقات متطابقة (فوز) نمنع الخلط
                if (matchedPairs === EMOJIS.length) return;

                // إيقاف المؤقت مؤقتاً (سنستمر فيه)
                const wasTimerRunning = timerInterval !== null;
                if (wasTimerRunning) {
                    stopTimer();
                }

                // جمع القيم غير المتطابقة فقط (التي لم تزل مكشوفة)
                const unmatchedValues = [];
                const unmatchedIndices = [];
                cardData.forEach((data, idx) => {
                    if (!data.matched) {
                        unmatchedValues.push(data.value);
                        unmatchedIndices.push(idx);
                    }
                });

                // إذا لم توجد بطاقات غير متطابقة (فوز) لا نفعل شيئاً
                if (unmatchedValues.length === 0) {
                    if (wasTimerRunning) startTimer();
                    return;
                }

                // خلط القيم غير المتطابقة
                const shuffledUnmatched = shuffleArray(unmatchedValues);

                // تحديث البيانات والعناصر للبطاقات غير المتطابقة
                unmatchedIndices.forEach((idx, i) => {
                    const newValue = shuffledUnmatched[i];
                    cardData[idx].value = newValue;
                    // تحديث المحتوى النصي للعنصر
                    const contentSpan = cards[idx].querySelector('.card-content');
                    if (contentSpan) {
                        contentSpan.textContent = newValue;
                    }
                    // إذا كانت البطاقة مقلوبة أو مطابقة سابقاً، نعيد ضبطها (لأننا نريد إخفاءها)
                    if (cards[idx].classList.contains('flipped') && !cards[idx].classList.contains('matched')) {
                        cards[idx].classList.remove('flipped');
                    }
                    // نتأكد من إزالة حالة المطابقة (لأننا غيرنا القيم)
                    // ولكن البطاقات المتطابقة لا نلمسها
                });

                // إعادة تعيين البطاقات المقلوبة المعلقة
                if (firstCard) {
                    if (!firstCard.classList.contains('matched')) {
                        firstCard.classList.remove('flipped');
                        firstCard.classList.remove('disabled');
                    }
                    firstCard = null;
                }
                if (secondCard) {
                    if (!secondCard.classList.contains('matched')) {
                        secondCard.classList.remove('flipped');
                        secondCard.classList.remove('disabled');
                    }
                    secondCard = null;
                }
                lockBoard = false;

                // استئناف المؤقت إذا كان يعمل
                if (wasTimerRunning) {
                    startTimer();
                }
            }

            // ---------- تهيئة اللعبة ----------
            function initGame() {
                const initialValues = [...EMOJIS, ...EMOJIS];
                buildBoard(initialValues);
                // إضافة مستمعين للأزرار
                resetBtn.addEventListener('click', resetGame);
                shuffleBtn.addEventListener('click', shuffleBoard);
            }

            // بدء التشغيل
            initGame();

        })();
    </script>
</body>
</html>
