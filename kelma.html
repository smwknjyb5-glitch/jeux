<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة الكلمات التعليمية</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma, Arial, sans-serif;
  background:linear-gradient(135deg,#07152d,#102b52,#07152d);
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

.container{
  width:95%;
  max-width:1000px;
  margin:25px auto;
  position:relative;
  z-index:2;
}

h1{
  text-align:center;
  margin-bottom:10px;
  font-size:32px;
}

.subtitle{
  text-align:center;
  margin-bottom:20px;
  opacity:.9;
}

/* ===== اختيار الصنف ===== */

.categoryBox{
  background:rgba(255,255,255,.08);
  border-radius:18px;
  padding:15px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.categoryTitle{
  text-align:center;
  font-size:20px;
  margin-bottom:12px;
}

.categoryButtons{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}

.categoryButtons button{
  border:none;
  border-radius:10px;
  padding:9px 14px;
  background:#234a7a;
  color:white;
  cursor:pointer;
  font-size:14px;
  transition:.2s;
}

.categoryButtons button:hover{
  transform:translateY(-2px);
  background:#32669f;
}

.categoryButtons button.active{
  background:#f5b642;
  color:#111;
  font-weight:bold;
}

/* ===== المعلومات ===== */

.info{
  display:flex;
  justify-content:space-around;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}

.infoBox{
  background:rgba(255,255,255,.1);
  padding:12px 20px;
  border-radius:12px;
  min-width:150px;
  text-align:center;
}

.infoBox span{
  font-weight:bold;
  font-size:20px;
}

/* ===== التصنيف ===== */

.categoryLabel{
  text-align:center;
  font-size:22px;
  margin:15px 0;
  color:#ffd76a;
}

/* ===== الإجابة ===== */

#answerArea{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  min-height:60px;
  margin:20px 0;
}

.slot{
  width:48px;
  height:48px;
  border:2px dashed #789;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  background:rgba(255,255,255,.06);
}

.slot.filled{
  border-style:solid;
  background:#275d91;
  cursor:pointer;
}

/* ===== الحروف ===== */

#lettersArea{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  margin:20px 0;
}

.tile{
  width:50px;
  height:50px;
  border:none;
  border-radius:12px;
  background:#e8f1ff;
  color:#102b52;
  font-size:25px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 4px 8px rgba(0,0,0,.3);
}

.tile:hover{
  transform:scale(1.08);
}

.tile.used{
  opacity:.25;
  cursor:not-allowed;
}

/* ===== الأزرار ===== */

.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin:20px 0;
}

.controls button{
  border:none;
  border-radius:12px;
  padding:12px 20px;
  font-size:17px;
  cursor:pointer;
  color:white;
}

#checkBtn{
  background:#159447;
}

#undoBtn{
  background:#4267a9;
}

#hintBtn{
  background:#b88900;
}

#skipBtn{
  background:#b63838;
}

.controls button:hover{
  opacity:.85;
}

/* ===== الرسائل ===== */

.message{
  min-height:35px;
  text-align:center;
  font-size:19px;
  margin:10px;
}

.message.ok{
  color:#62ff9a;
}

.message.err{
  color:#ff7777;
}

#hintText{
  text-align:center;
  color:#ffe477;
  min-height:30px;
}

/* ===== النجوم ===== */

#stars{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:0;
  pointer-events:none;
}

.star{
  position:absolute;
  background:white;
  border-radius:50%;
  animation:twinkle infinite alternate;
}

@keyframes twinkle{
  from{
    opacity:.15;
  }
  to{
    opacity:1;
  }
}

.footer{
  text-align:center;
  margin-top:25px;
  opacity:.7;
  font-size:13px;
}

/* ===== الهاتف ===== */

@media(max-width:600px){

  }

  .categoryButtons button{
    font-size:12px;
    padding:8px 10px;
  }
}
</style>
</head>

/* =========================================================
   متغيرات اللعبة
========================================================= */

let deck = [];
let currentIndex = 0;
let currentWord = "";
let scrambled = [];
let answer = [];
let usedFlags = [];

let score = 0;
let tries = 3;
let hintUsed = false;

let selectedCategory = "الكل";


/* =========================================================
   عناصر الصفحة
========================================================= */

const answerArea =
document.getElementById('answerArea');

const lettersArea =
document.getElementById('lettersArea');

const messageEl =
document.getElementById('message');

const hintText =
document.getElementById('hintText');

const scoreVal =
document.getElementById('scoreVal');

const triesVal =
document.getElementById('triesVal');

const roundVal =
document.getElementById('roundVal');

const categoryLabel =
document.getElementById('categoryLabel');

const categoryButtons =
document.getElementById('categoryButtons');


/* =========================================================
   خلط المصفوفة
========================================================= */

function shuffleArray(arr){

  const a = [...arr];

  for(let i=a.length-1;i>0;i--){

    const j =
      Math.floor(Math.random()*(i+1));

    [a[i],a[j]] =
    [a[j],a[i]];
  }

  return a;
}


/* =========================================================
   إنشاء أزرار الأصناف
========================================================= */

function buildCategoryButtons(){

  const categories = [
    "الكل",
    ...new Set(wordBank.map(item => item.cat))
  ];

  categoryButtons.innerHTML = "";

  categories.forEach(cat => {

    const btn =
      document.createElement("button");

    btn.textContent = cat;

    if(cat === selectedCategory){
      btn.classList.add("active");
    }

    btn.onclick = () => {

      selectedCategory = cat;

      currentIndex = 0;

      buildDeck();

      updateCategoryButtons();

      startRound();
    };

    categoryButtons.appendChild(btn);
  });
}


/* =========================================================
   تحديث حالة أزرار الأصناف
========================================================= */

function updateCategoryButtons(){

  const buttons =
    categoryButtons.querySelectorAll("button");

  buttons.forEach(btn => {

    btn.classList.toggle(
      "active",
      btn.textContent === selectedCategory
    );

  });
}


/* =========================================================
   إنشاء مجموعة الكلمات
========================================================= */

function buildDeck(){

  let source;

  if(selectedCategory === "الكل"){

    source = wordBank;

  }else{

    source =
      wordBank.filter(
        item => item.cat === selectedCategory
      );
  }

  deck = shuffleArray(source);
}


/* =========================================================
   بدء الجولة
========================================================= */

function startRound(){

  if(deck.length === 0){

    showMessage(
      "لا توجد كلمات في هذا الصنف",
      "err"
    );

    return;
  }

  if(currentIndex >= deck.length){

    buildDeck();

    currentIndex = 0;
  }

  const entry =
    deck[currentIndex];

  currentWord =
    entry.word;

  categoryLabel.textContent =
    "التصنيف: " + entry.cat;

  roundVal.textContent =
    (currentIndex + 1) +
    " / " +
    deck.length;


  let letters =
    currentWord.split('');


  let attempt = 0;

  do{

    scrambled =
      shuffleArray(letters);

    attempt++;

  }while(
    scrambled.join('') === currentWord &&
    attempt < 10
  );


  usedFlags =
    new Array(scrambled.length)
    .fill(false);

  answer = [];

  hintUsed = false;

  messageEl.textContent = "";

  messageEl.className = "message";

  hintText.textContent = "";


  renderAnswer();

  renderLetters();
}


/* =========================================================
   عرض منطقة الإجابة
========================================================= */

function renderAnswer(){

  answerArea.innerHTML = "";

  for(
    let i=0;
    i<currentWord.length;
    i++
  ){

    const slot =
      document.createElement('div');


    if(answer[i] !== undefined){

      slot.className =
        "slot filled";

      slot.textContent =
        answer[i].ch;

      slot.onclick =
        () => removeFromAnswer(i);

    }else{

      slot.className =
        "slot";
    }

    answerArea.appendChild(slot);
  }
}


/* =========================================================
   عرض الحروف
========================================================= */

function renderLetters(){

  lettersArea.innerHTML = "";

  scrambled.forEach((ch, idx) => {

    const btn =
      document.createElement('button');

    btn.className =
      "tile" +
      (usedFlags[idx] ? " used" : "");

    btn.textContent = ch;

    btn.onclick =
      () => addToAnswer(ch, idx);

    lettersArea.appendChild(btn);
  });
}


/* =========================================================
   إضافة حرف للإجابة
========================================================= */

function addToAnswer(ch, idx){

  if(usedFlags[idx])
    return;

  if(answer.length >= currentWord.length)
    return;

  usedFlags[idx] = true;

  answer.push({
    ch:ch,
    idx:idx
  });

  renderAnswer();

  renderLetters();
}


/* =========================================================
   حذف حرف من الإجابة
========================================================= */

function removeFromAnswer(slotIndex){

  const item =
    answer[slotIndex];

  if(!item)
    return;

  usedFlags[item.idx] =
    false;

  answer.splice(
    slotIndex,
    1
  );

  renderAnswer();

  renderLetters();
}


/* =========================================================
   التحقق من الإجابة
========================================================= */

function checkAnswer(){

  if(
    answer.length !==
    currentWord.length
  ){

    showMessage(
      "أكمل كل الحروف أولاً!",
      "err"
    );

    return;
  }


  const built =
    answer.map(a => a.ch).join('');


  if(built === currentWord){

    const points =
      hintUsed ? 5 : 10;

    score += points;

    scoreVal.textContent =
      score;

    showMessage(
      "أحسنت! +" +
      points +
      " نقطة 🎉",
      "ok"
    );

    currentIndex++;

    setTimeout(
      startRound,
      1100
    );

  }else{

    tries--;

    triesVal.textContent =
      tries;


    if(tries <= 0){

      showMessage(
        "انتهت المحاولات، الكلمة كانت: " +
        currentWord,
        "err"
      );

      tries = 3;

      triesVal.textContent =
        tries;

      currentIndex++;

      setTimeout(
        startRound,
        1600
      );

    }else{

      showMessage(
        "محاولة خاطئة، حاول مجدداً",
        "err"
      );
    }
  }
}


/* =========================================================
   التراجع
========================================================= */

function undoLast(){

  if(answer.length === 0)
    return;

  removeFromAnswer(
    answer.length - 1
  );
}


/* =========================================================
   التلميح
========================================================= */

function showHint(){

  hintUsed = true;

  hintText.textContent =
    "أول حرف: " +
    currentWord[0] +
    " — عدد الحروف: " +
    currentWord.length;
}


/* =========================================================
   تخطي الكلمة
========================================================= */

function skipWord(){

  showMessage(
    "تم التخطي، الكلمة كانت: " +
    currentWord,
    "err"
  );

  currentIndex++;

  setTimeout(
    startRound,
    900
  );
}


/* =========================================================
   الرسائل
========================================================= */

function showMessage(text,type){

  messageEl.textContent =
    text;

  messageEl.className =
    "message " + type;
}


/* =========================================================
   ربط الأزرار
========================================================= */

document.getElementById(
  'checkBtn'
).onclick = checkAnswer;

document.getElementById(
  'undoBtn'
).onclick = undoLast;

document.getElementById(
  'hintBtn'
).onclick = showHint;

document.getElementById(
  'skipBtn'
).onclick = skipWord;


/* =========================================================
   خلفية النجوم
========================================================= */

function createStars(){

  const container =
    document.getElementById('stars');

  const count = 90;

  for(
    let i=0;
    i<count;
    i++
  ){

    const s =
      document.createElement('div');

    s.className = 'star';

    const size =
      Math.random()*2 + 1;

    s.style.width =
      size + 'px';

    s.style.height =
      size + 'px';

    s.style.top =
      Math.random()*100 + '%';

    s.style.left =
      Math.random()*100 + '%';

    s.style.animationDuration =
      (Math.random()*3 + 2) + 's';

    s.style.animationDelay =
      (Math.random()*3) + 's';

    container.appendChild(s);
  }
}


/* =========================================================
   تشغيل اللعبة
========================================================= */

createStars();

buildCategoryButtons();

buildDeck();

startRound();

</script>
