 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المربع السحري</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0f1923;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Cairo', sans-serif;
      color: #e8d5a3;
      padding: 20px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(1px 1px at 20% 30%, #fff3 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 15%, #fff2 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 70%, #fff3 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 55%, #fff2 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 80%, #fff3 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 90%, #fff2 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    .title {
      font-family: 'Amiri', serif;
      font-size: 2.6rem;
      color: #c9a84c;
      text-shadow: 0 0 30px #c9a84c66;
      margin-bottom: 6px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #8a9bb0;
      margin-bottom: 20px;
    }

    .level-select {
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: #8a9bb0;
    }

    .level-select select {
      background: #1a2535;
      color: #e8d5a3;
      border: 1px solid #c9a84c55;
      border-radius: 8px;
      padding: 6px 12px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

    .level-select select:hover { border-color: #c9a84c; }

    .info-bar {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: #8a9bb0;
    }

    .info-bar span strong {
      color: #c9a84c;
      font-size: 1.1rem;
    }

    .hint-box {
      background: #1a2535;
      border: 1px solid #c9a84c44;
      border-radius: 12px;
      padding: 10px 20px;
      margin-bottom: 22px;
      font-size: 0.88rem;
      color: #8a9bb0;
    }

    .hint-box strong { color: #c9a84c; }

    .grid-wrap {
      background: linear-gradient(135deg, #1a2535, #0d1825);
      border: 2px solid #c9a84c55;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 0 60px #c9a84c22, inset 0 0 40px #00000044;
      margin: 0 auto 24px;
      display: inline-block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 90px);
      grid-template-rows: repeat(3, 90px);
      gap: 10px;
    }

    .cell {
      width: 90px;
      height: 90px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Amiri', serif;
      font-size: 2rem;
      font-weight: 700;
      transition: all 0.2s ease;
      position: relative;
    }

    .cell.fixed {
      background: linear-gradient(135deg, #1e3a5f, #162d4a);
      border: 2px solid #c9a84c88;
      color: #c9a84c;
      box-shadow: 0 0 15px #c9a84c22;
      cursor: default;
    }

    .cell.fixed::after {
      content: '🔒';
      position: absolute;
      font-size: 0.55rem;
      bottom: 6px;
      left: 6px;
      opacity: 0.5;
    }

    .cell input {
      width: 100%;
      height: 100%;
      background: #0f1923;
      border: 2px solid #2a3f5f;
      border-radius: 10px;
      color: #e8d5a3;
      font-family: 'Amiri', serif;
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
      cursor: pointer;
      caret-color: #c9a84c;
    }

    .cell input:focus {
      border-color: #c9a84c;
      box-shadow: 0 0 20px #c9a84c44;
      background: #131e2e;
    }

    .cell input.correct {
      border-color: #4caf8a;
      color: #4caf8a;
      box-shadow: 0 0 15px #4caf8a44;
      background: #0d2018;
    }

    .cell input.wrong {
      border-color: #e05555;
      color: #e05555;
      box-shadow: 0 0 15px #e0555544;
      background: #1f0d0d;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .sums {
      display: grid;
      grid-template-columns: repeat(3, 90px);
      gap: 10px;
      margin: 0 auto;
      justify-content: center;
    }

    .sum-badge {
      height: 30px;
      border-radius: 8px;
      background: #1a2535;
      border: 1px solid #2a3f5f;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8a9bb0;
      transition: all 0.3s;
    }

    .sum-badge.ok { border-color: #4caf8a; color: #4caf8a; }
    .sum-badge.bad { border-color: #e05555; color: #e05555; }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 28px;
      border-radius: 30px;
      border: none;
      font-family: 'Cairo', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-check {
      background: linear-gradient(135deg, #c9a84c, #a8852a);
      color: #0f1923;
      box-shadow: 0 4px 20px #c9a84c44;
    }

    .btn-check:hover { transform: translateY(-2px); box-shadow: 0 6px 28px #c9a84c66; }

    .btn-reset {
      background: transparent;
      color: #8a9bb0;
      border: 1px solid #2a3f5f;
    }

    .btn-reset:hover { border-color: #c9a84c; color: #c9a84c; }

    .btn-hint {
      background: transparent;
      color: #5a8fc0;
      border: 1px solid #2a3f5f;
    }

    .btn-hint:hover { border-color: #5a8fc0; }

    .message {
      min-height: 40px;
      font-size: 1rem;
      font-weight: 600;
      margin: 16px 0 20px;
      transition: opacity 0.3s;
    }

    .message.success { color: #4caf8a; }
    .message.error   { color: #e05555; }
    .message.info    { color: #5a8fc0; }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 60px #c9a84c22, inset 0 0 40px #00000044; }
      50%       { box-shadow: 0 0 100px #c9a84c66, inset 0 0 40px #00000044; }
    }

    .grid-wrap.win { animation: glow 1.5s ease infinite; border-color: #c9a84c; }

    .tries-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 8px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #2a3f5f;
      transition: background 0.3s;
    }

    .dot.used { background: #e05555; }
  </style>
</head>
<body>
<div class="container">
  <div class="title">✦ المربع السحري ✦</div>
  <div class="subtitle">اجعل مجموع كل صف وعمود وقطر يساوي نفس العدد</div>

  <div class="level-select">
    <label for="levelSelect">اختر المستوى: </label>
    <select id="levelSelect" onchange="newGame()">
      <option value="0">المجموع 12 (الأرقام من 0 إلى 8)</option>
      <option value="1" selected>المجموع 15 (الأرقام من 1 إلى 9)</option>
      <option value="2">المجموع 18 (الأرقام من 2 إلى 10)</option>
      <option value="3">المجموع 21 (الأرقام من 3 إلى 11)</option>
      <option value="4">المجموع 24 (الأرقام من 4 إلى 12)</option>
    </select>
  </div>

  <div class="hint-box">
    المجموع السحري = <strong id="magicSum">—</strong> &nbsp;|&nbsp;
    استخدم الأرقام: <strong id="numRange">—</strong>
  </div>

  <div class="info-bar">
    <span>الوقت: <strong id="timer">00:00</strong></span>
    <span>المحاولات: <strong id="triesCount">0</strong></span>
  </div>

  <div class="grid-wrap" id="gridWrap">
    <div class="grid" id="grid"></div>
    <div style="margin-top:10px">
      <div class="sums" id="colSums"></div>
    </div>
  </div>

  <div class="message" id="message"></div>

  <div class="buttons">
    <button class="btn-check" onclick="checkSolution()">تحقق ✓</button>
    <button class="btn-hint"  onclick="giveHint()">تلميح 💡</button>
    <button class="btn-reset" onclick="newGame()">لعبة جديدة ↺</button>
  </div>

  <div class="tries-dots" id="dots"></div>
</div>

<script>
// === حلول أساسية للمربع السحري 3×3 بالأرقام 1-9 (مجموعها دائمًا 15) ===
// كل المستويات الأخرى تُشتق من هذه الحلول بإزاحة الأرقام رياضيًا
const SOLUTIONS = [
  [2,7,6, 9,5,1, 4,3,8],
  [2,9,4, 7,5,3, 6,1,8],
  [4,9,2, 3,5,7, 8,1,6],
  [6,1,8, 7,5,3, 2,9,4],
  [8,1,6, 3,5,7, 4,9,2],
  [8,3,4, 1,5,9, 6,7,2],
  [4,3,8, 9,5,1, 2,7,6],
  [6,7,2, 1,5,9, 8,3,4],
];

// === تعريف المستويات: كل مستوى = أصغر رقم مسموح ===
// المجموع السحري يُحسب تلقائيًا بالصيغة: magic = 3 * min + 12
// لإضافة مستوى جديد: أضف {min: X} هنا وخيارًا جديدًا في <select id="levelSelect">
const LEVELS = [
  { min: 0 },  // مجموع 12، أرقام 0-8
  { min: 1 },  // مجموع 15، أرقام 1-9
  { min: 2 },  // مجموع 18، أرقام 2-10
  { min: 3 },  // مجموع 21، أرقام 3-11
  { min: 4 },  // مجموع 24، أرقام 4-12
];

let currentLevel = { min: 1, max: 9, magic: 15 };
let solution = [];
let fixed = [];
let tries = 0;
let hintUsed = false;
let won = false;
let timerInterval = null;
let seconds = 0;

const MAX_TRIES = 5;

function getSelectedLevel() {
  const idx = parseInt(document.getElementById('levelSelect').value);
  const lvl = LEVELS[idx];
  const min = lvl.min;
  const max = min + 8;
  const magic = 3 * min + 12;
  return { min, max, magic };
}

function newGame() {
  currentLevel = getSelectedLevel();

  // اختيار حل أساسي عشوائي (بالأرقام 1-9) ثم إزاحته لمطابقة المستوى المختار
  const base = SOLUTIONS[Math.floor(Math.random() * SOLUTIONS.length)];
  const shift = currentLevel.min - 1;
  solution = base.map(v => v + shift);

  const positions = [...Array(9).keys()];
  shuffle(positions);
  fixed = positions.slice(0, 2);

  tries = 0;
  hintUsed = false;
  won = false;

  document.getElementById('triesCount').textContent = '0';
  document.getElementById('message').textContent = '';
  document.getElementById('message').className = 'message';
  document.getElementById('gridWrap').classList.remove('win');

  document.getElementById('magicSum').textContent = currentLevel.magic;
  document.getElementById('numRange').textContent = `${currentLevel.min} → ${currentLevel.max}`;

  buildGrid();
  buildDots();
  resetTimer();
  startTimer();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function buildGrid() {
  const grid = document.getElementById('grid');
  const colSums = document.getElementById('colSums');
  grid.innerHTML = '';
  colSums.innerHTML = '';

  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';

    if (fixed.includes(i)) {
      cell.classList.add('fixed');
      cell.textContent = solution[i];
      cell.dataset.val = solution[i];
    } else {
      const inp = document.createElement('input');
      inp.type = 'number';
      inp.min = currentLevel.min; inp.max = currentLevel.max;
      inp.placeholder = '؟';
      inp.dataset.idx = i;
      inp.addEventListener('input', () => {
        let v = parseInt(inp.value);
        if (isNaN(v)) { inp.value = ''; return; }
        if (v < currentLevel.min) inp.value = currentLevel.min;
        if (v > currentLevel.max) inp.value = currentLevel.max;
        inp.classList.remove('correct','wrong');
        updateLiveSums();
      });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') checkSolution();
      });
      cell.appendChild(inp);
    }

    grid.appendChild(cell);
  }

  for (let c = 0; c < 3; c++) {
    const b = document.createElement('div');
    b.className = 'sum-badge';
    b.id = `colSum${c}`;
    colSums.appendChild(b);
  }

  updateLiveSums();
}

function getValues() {
  const vals = [];
  for (let i = 0; i < 9; i++) {
    if (fixed.includes(i)) {
      vals.push(solution[i]);
    } else {
      const inp = document.querySelector(`input[data-idx="${i}"]`);
      vals.push(inp && inp.value !== '' ? parseInt(inp.value) : null);
    }
  }
  return vals;
}

function rowSum(vals, r) {
  const row = vals.slice(r*3, r*3+3);
  return row.some(v => v === null) ? null : row.reduce((a,b)=>a+b,0);
}

function colSumF(vals, c) {
  const col = [vals[c], vals[c+3], vals[c+6]];
  return col.some(v => v === null) ? null : col.reduce((a,b)=>a+b,0);
}

function updateLiveSums() {
  const vals = getValues();
  for (let c = 0; c < 3; c++) {
    const b = document.getElementById(`colSum${c}`);
    const s = colSumF(vals, c);
    if (s === null) { b.textContent = ''; b.className = 'sum-badge'; }
    else if (s === currentLevel.magic) { b.textContent = `↑ ${s} ✓`; b.className = 'sum-badge ok'; }
    else { b.textContent = `↑ ${s}`; b.className = 'sum-badge bad'; }
  }
}

function checkSolution() {
  if (won) return;

  const vals = getValues();
  const inputs = document.querySelectorAll('input[data-idx]');

  if (vals.some(v => v === null)) {
    showMsg('أكمل جميع الخانات أولاً!', 'info');
    return;
  }

  const sorted = [...vals].sort((a,b)=>a-b);
  const valid = sorted.every((v,i) => v === i + currentLevel.min);

  tries++;
  document.getElementById('triesCount').textContent = tries;
  updateDots();

  if (!valid) {
    inputs.forEach(inp => inp.classList.add('wrong'));
    setTimeout(() => inputs.forEach(inp => inp.classList.remove('wrong')), 600);
    showMsg(`يجب استخدام الأرقام من ${currentLevel.min} إلى ${currentLevel.max} بدون تكرار!`, 'error');
    return;
  }

  const MAGIC = currentLevel.magic;
  const lines = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6],
  ];

  let allOk = true;
  lines.forEach(line => {
    const s = line.reduce((a,i) => a + vals[i], 0);
    if (s !== MAGIC) allOk = false;
  });

  if (allOk) {
    inputs.forEach(inp => inp.classList.add('correct'));
    document.getElementById('gridWrap').classList.add('win');
    stopTimer();
    won = true;
    showMsg(`🎉 أحسنت! حللت المربع السحري في ${formatTime(seconds)} بـ${tries} محاولة${tries===1?'':''}`, 'success');
  } else {
    inputs.forEach(inp => {
      const i = parseInt(inp.dataset.idx);
      if (vals[i] !== solution[i]) {
        inp.classList.add('wrong');
        setTimeout(() => inp.classList.remove('wrong'), 700);
      }
    });
    showMsg(tries >= MAX_TRIES ? 'استنفدت محاولاتك — اضغط "تلميح" أو "لعبة جديدة"' : 'لم تُحل بعد، حاول مجدداً!', 'error');
  }
}

function giveHint() {
  if (won) return;
  const inputs = document.querySelectorAll('input[data-idx]');
  const empty = [...inputs].filter(inp => inp.value === '');

  if (empty.length === 0) {
    showMsg('جميع الخانات ممتلئة بالفعل', 'info');
    return;
  }

  const target = empty[Math.floor(Math.random() * empty.length)];
  const i = parseInt(target.dataset.idx);
  target.value = solution[i];
  target.classList.add('correct');
  updateLiveSums();
  hintUsed = true;
  showMsg('تم ملء خانة واحدة كتلميح 💡', 'info');
}

function showMsg(text, type) {
  const m = document.getElementById('message');
  m.textContent = text;
  m.className = `message ${type}`;
}

function startTimer() {
  seconds = 0;
  timerInterval = setInterval(() => {
    seconds++;
    document.getElementById('timer').textContent = formatTime(seconds);
  }, 1000);
}

function stopTimer() { clearInterval(timerInterval); }

function resetTimer() {
  stopTimer();
  seconds = 0;
  document.getElementById('timer').textContent = '00:00';
}

function formatTime(s) {
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

function buildDots() {
  const d = document.getElementById('dots');
  d.innerHTML = '';
  for (let i = 0; i < MAX_TRIES; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.id = `dot${i}`;
    d.appendChild(dot);
  }
}

function updateDots() {
  for (let i = 0; i < MAX_TRIES; i++) {
    const dot = document.getElementById(`dot${i}`);
    if (dot) dot.classList.toggle('used', i < tries);
  }
}

newGame();
</script>
</body>
</html>
